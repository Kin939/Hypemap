# ============================================================================
#  Альтернатива: Cloudflare Pages (Pages Functions из каталога functions/)
#  Деплой:  npx wrangler pages deploy web/dist --project-name hypemap \
#             --config wrangler.pages.toml
#  В дашборде Pages достаточно полей:
#    Build command:         cd web && npm ci && npm run build
#    Build output directory: web/dist
#    Root directory:        /
# ============================================================================
name = "hypemap"
pages_build_output_dir = "web/dist"

[vars]
HYPEMAP_ORIGIN = "https://mc.example.com"
TILES_CACHE_TTL = "604800"
# Если Dynmap доступен по другому адресу (хостинг без туннеля) — раскомментируйте.
# ВАЖНО: только HTTPS/порт 443 (или http/80). Нестандартные порты вроде :25960
# из воркера не работают — используйте rProxy панели или туннель (docs/DEPLOY.md §5.4).
# HYPEMAP_DYNMAP_ORIGIN = "https://map.example.com"
