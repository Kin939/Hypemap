# Cloudflare Pages project (Git integration или `wrangler pages deploy web/dist`)
name = "hypemap"
compatibility_date = "2025-12-01"
pages_build_output_dir = "web/dist"

[vars]
# Публичный хостнейм туннеля, за которым живёт Minecraft-сервер.
# Меняется в dashboard (Settings → Environment variables) или здесь.
HYPEMAP_ORIGIN = "https://mc.example.com"
# Кеш тайлов на edge, секунды (7 дней)
TILES_CACHE_TTL = "604800"

# Секреты (не храните в репозитории!):
#   wrangler pages secret put ACCESS_CLIENT_ID --project-name hypemap
#   wrangler pages secret put ACCESS_CLIENT_SECRET --project-name hypemap
